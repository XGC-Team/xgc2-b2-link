schema: xgc2.product.v1
id: xgc2-b2-link
name: XGC2 B2 Link (onboard forwarders)
version: 0.1.2
kind: ros2-apt
summary: >-
  Unitree B2 (and R5 arm status) cross-host link: onboard whitelist forwarder
  sharing one Zenoh/TCP key contract with the production Noetic B2 Adapter.
  The Python ground probe is contract-test-only and never recovers ROS.
groups:
- ros2
- driver
- robot
- link
ros:
  distro: jazzy
  packages:
  - xgc2_b2_link
apt:
  distribution: noble
  install:
  - ros-jazzy-xgc2-b2-link
  packages:
  - ros-jazzy-xgc2-b2-link
  package_architectures:
    ros-jazzy-xgc2-b2-link:
    - amd64
    - arm64
  depends:
  - python3-yaml
  - ros-jazzy-ament-index-python
  recommends:
  - ros-jazzy-b2-ros2-driver
  - ros-jazzy-arx5-arm-msg
  # eclipse-zenoh is required only when transport=zenoh; there is no fallback.
usage:
  install: |
    # Thor / Ubuntu 24.04 + ROS 2 Jazzy (onboard forwarder)
    sudo apt update
    sudo apt install ros-jazzy-xgc2-b2-link
    source /opt/ros/jazzy/setup.bash
    # example (after drivers are up):
    # Packaged forwarder_d0.yaml is resolved through the ROS 2 package index.
    # ros2 run xgc2_b2_link b2_forwarder_d0
  smoke_test: |
    ros2 pkg prefix xgc2_b2_link
    test -f "$(ros2 pkg prefix xgc2_b2_link)/share/xgc2_b2_link/contract/zenoh_v1.yaml"
    test -x "$(ros2 pkg prefix xgc2_b2_link)/lib/xgc2_b2_link/b2_forwarder_d0"
    test -x "$(ros2 pkg prefix xgc2_b2_link)/lib/xgc2_b2_link/b2_forwarder_d17"
    test -x "$(ros2 pkg prefix xgc2_b2_link)/lib/xgc2_b2_link/b2_sim_publisher"
ownership:
  paths:
  - /opt/ros/jazzy/lib/xgc2_b2_link
  - /opt/ros/jazzy/share/xgc2_b2_link
  - /opt/ros/jazzy/lib/python3.12/site-packages/xgc2_b2_link
release:
  # Public sub-repo target (create when first APT train runs)
  repository: lxk36/xgc2-b2-link
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    noble: 0.1.2
